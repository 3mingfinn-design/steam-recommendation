name: Sync Steam game index

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Steam API key
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          if [ -z "$STEAM_API_KEY" ]; then
            echo "::error::STEAM_API_KEY repository secret is not configured"
            exit 1
          fi
      - run: pnpm sync:steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_SYNC_DETAIL_LIMIT: 300
      - name: Commit refreshed index
        run: |
          git config user.name "steam-index-bot"
          git config user.email "steam-index-bot@users.noreply.github.com"
          git add data/steam-apps.json data/steam-games.json data/steam-sync-state.json
          git diff --cached --quiet || git commit -m "chore: refresh Steam game index"
          git push
